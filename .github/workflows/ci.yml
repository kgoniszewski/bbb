name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest   # Apple silicon: exercises the NEON kernel
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render and analyse
        run: |
          python -m pip install --quiet numpy
          ./build/tools/render_cli/render_cli --seconds 3 --out c4.wav
          python tools/analysis/analyze_string.py c4.wav --f0 261.63 --B 3.8e-4 --b1 0.5 --b3 6.25e-9 --partials 10

      - name: Benchmark (informational)
        run: ./build/tools/bench/bench_modal --seconds 0.5 --reps 2
