name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: ubuntu-latest  # portable fallback kernel
            cxx: g++
            flags: -DPM_SIMD_FORCE_SCALAR
          - os: macos-latest   # Apple silicon: exercises the NEON kernel
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render and analyse
        run: |
          python -m pip install --quiet numpy
          ./build/tools/render_cli/render_cli --seconds 3 --out c4.wav
          python tools/analysis/analyze_string.py c4.wav --f0 261.63 --B 3.8e-4 --b1 0.5 --b3 6.25e-9 --partials 10
          for s in tools/render_cli/scores/*.txt; do
            ./build/tools/render_cli/render_cli --score "$s" --out "$(basename "$s" .txt).wav" --quiet
          done
          python tools/analysis/analyze_note.py single_notes.wav --note 60 --at 12.5,15,17.5,20,22.5
          python tools/analysis/analyze_decay.py double_decay.wav --note 60 --at 0 --seconds 25 --partials 4
          python tools/analysis/analyze_decay.py una_corda.wav --note 60 --at 0,8,16 --seconds 7.5 --partials 2
          ./build/tools/reference_fdtd/reference_fdtd --key 40 --seconds 0.2 --points 300 --partials 10

      - name: Benchmark (informational)
        run: |
          ./build/tools/bench/bench_modal --seconds 0.5 --reps 2
          ./build/tools/bench/bench_engine --seconds 1

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc -DPM_BUILD_BENCH=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
